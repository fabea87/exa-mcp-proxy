name = "exa-mcp-proxy"
main = "src/index.js"
compatibility_date = "2025-03-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "COORDINATOR", class_name = "ExaProxyCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExaProxyCoordinator"]

[vars]
UPSTREAM_MCP_URL = "https://mcp.exa.ai/mcp"
